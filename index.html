<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>智慧冰箱庫存管家</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="冰箱管家">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#10B981">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    @supports (-webkit-touch-callout: none) {
      .safe-bottom { padding-bottom: max(1.25rem, env(safe-area-inset-bottom)); }
      .safe-top { padding-top: max(0.75rem, env(safe-area-inset-top)); }
    }
    .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    #qr-reader video { border-radius: 0.75rem; object-fit: cover; width: 100% !important; }
    
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .mic-recording {
      animation: pulse-ring 1.5s infinite;
      background-color: #ef4444 !important;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased font-sans flex flex-col min-h-screen select-none">

  <!-- 頂部導航 -->
  <header class="bg-emerald-600 text-white sticky top-0 z-30 shadow-md safe-top">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-kitchen-set text-xl text-emerald-200"></i>
        <h1 class="text-lg font-bold tracking-wide">智慧冰箱管家</h1>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="openSettingsModal()" class="p-2 text-emerald-100 hover:text-white rounded-full transition" title="條碼庫與設定">
          <i class="fa-solid fa-gear text-lg"></i>
        </button>
        <button onclick="openAddModal()" class="bg-white text-emerald-700 px-3 py-1.5 rounded-lg text-sm font-semibold shadow hover:bg-emerald-50 active:scale-95 transition flex items-center space-x-1">
          <i class="fa-solid fa-plus text-xs"></i>
          <span>新增</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容容器 -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-4 pb-24">

    <!-- 晨報與即時警報 Banner -->
    <div id="alertBanner" class="bg-amber-50 border border-amber-200 rounded-xl p-3 shadow-sm flex items-start justify-between">
      <div class="flex items-start space-x-2.5">
        <i class="fa-solid fa-bell text-amber-500 mt-1"></i>
        <div>
          <h2 class="text-xs font-bold text-amber-900 tracking-wide">今日冰箱晨報</h2>
          <p id="alertSummary" class="text-xs text-amber-800 mt-0.5 leading-relaxed">正在盤點冰箱庫存與過期食材...</p>
        </div>
      </div>
      <button onclick="copyLineReport()" class="text-xs bg-amber-200 hover:bg-amber-300 text-amber-900 font-medium px-2 py-1 rounded transition whitespace-nowrap active:scale-95">
        <i class="fa-regular fa-copy mr-0.5"></i> 複製 LINE
      </button>
    </div>

    <!-- 快捷功能區 -->
    <div class="bg-gradient-to-r from-emerald-500 to-teal-600 rounded-2xl p-4 text-white shadow-md flex items-center justify-between">
      <div>
        <h3 class="font-bold text-base flex items-center gap-1.5">
          <span>庫存智慧更新</span>
          <span class="bg-emerald-700/60 text-[10px] px-1.5 py-0.5 rounded-full font-normal">精準聲控</span>
        </h3>
        <p class="text-xs text-emerald-100 mt-0.5">支援品牌名語音（如：林鳳營牛奶剩兩瓶）與掃碼</p>
      </div>
      <button onclick="startScannerModal()" class="bg-white text-emerald-700 hover:bg-emerald-50 font-bold px-3 py-2 rounded-xl text-sm shadow flex items-center space-x-1.5 active:scale-95 transition">
        <i class="fa-solid fa-barcode text-base"></i>
        <span>掃碼</span>
      </button>
    </div>

    <!-- 區域分類標籤 -->
    <div class="flex space-x-2 overflow-x-auto pb-1 custom-scroll text-sm">
      <button onclick="setFilter('all')" id="tab-all" class="filter-tab px-3 py-1.5 rounded-full font-medium transition whitespace-nowrap bg-emerald-600 text-white shadow-sm">全部 (<span id="count-all">0</span>)</button>
      <button onclick="setFilter('fridge')" id="tab-fridge" class="filter-tab px-3 py-1.5 rounded-full font-medium transition whitespace-nowrap bg-white text-slate-600 border border-slate-200">冷藏 (<span id="count-fridge">0</span>)</button>
      <button onclick="setFilter('freezer')" id="tab-freezer" class="filter-tab px-3 py-1.5 rounded-full font-medium transition whitespace-nowrap bg-white text-slate-600 border border-slate-200">冷凍 (<span id="count-freezer">0</span>)</button>
      <button onclick="setFilter('pantry')" id="tab-pantry" class="filter-tab px-3 py-1.5 rounded-full font-medium transition whitespace-nowrap bg-white text-slate-600 border border-slate-200">常溫/乾貨 (<span id="count-pantry">0</span>)</button>
      <button onclick="setFilter('warning')" id="tab-warning" class="filter-tab px-3 py-1.5 rounded-full font-medium transition whitespace-nowrap bg-white text-rose-600 border border-rose-200">⚠️ 需注意 (<span id="count-warning">0</span>)</button>
    </div>

    <!-- 食材清單容器 -->
    <div id="foodList" class="space-y-2.5"></div>

    <!-- 採買清單分頁 -->
    <div id="shoppingSection" class="hidden space-y-3">
      <div class="flex items-center justify-between">
        <h3 class="font-bold text-slate-700 text-sm">待採買補貨清單</h3>
        <button onclick="clearCompletedShopping()" class="text-xs text-slate-500 hover:text-slate-700 underline">清除已買項目</button>
      </div>
      <div id="shoppingList" class="space-y-2"></div>
    </div>
  </main>

  <!-- 語音辨識浮動懸浮鈕 (FAB) -->
  <div class="fixed right-5 bottom-20 z-40 flex flex-col items-end">
    <div id="voiceTranscriptTip" class="hidden mb-2 bg-slate-900/90 text-white text-xs px-3.5 py-2 rounded-xl shadow-lg backdrop-blur-sm max-w-[260px] text-right leading-relaxed">
      請說，例如：「林鳳營牛奶剩兩瓶」
    </div>
    <button id="micBtn" onclick="toggleVoiceRecognition()" class="w-14 h-14 bg-emerald-600 text-white rounded-full shadow-2xl flex items-center justify-center text-xl transition transform active:scale-90 hover:scale-105 border-2 border-white">
      <i id="micIcon" class="fa-solid fa-microphone"></i>
    </button>
  </div>

  <!-- 底部固定導覽列 -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-20 safe-bottom">
    <div class="max-w-md mx-auto grid grid-cols-2 text-center text-xs">
      <button onclick="switchView('inventory')" id="nav-inv" class="py-2.5 text-emerald-600 font-bold flex flex-col items-center">
        <i class="fa-solid fa-cubes-stacked text-base mb-1"></i>
        <span>冰箱庫存</span>
      </button>
      <button onclick="switchView('shopping')" id="nav-shop" class="py-2.5 text-slate-400 font-medium flex flex-col items-center relative">
        <i class="fa-solid fa-cart-shopping text-base mb-1"></i>
        <span>採買清單</span>
        <span id="shopBadge" class="hidden absolute top-1 right-1/4 bg-rose-500 text-white text-[10px] px-1.5 py-0.2 rounded-full">0</span>
      </button>
    </div>
  </nav>

  <!-- 彈窗：新增/編輯食材 -->
  <div id="itemModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden backdrop-blur-sm">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center pb-2 border-b">
        <h3 id="modalTitle" class="font-bold text-slate-800 text-base">新增食材入庫</h3>
        <button onclick="closeItemModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form id="foodForm" onsubmit="handleSaveItem(event)" class="space-y-3">
        <input type="hidden" id="editItemId">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">商品條碼 (選填)</label>
          <div class="flex space-x-1">
            <input type="text" id="itemBarcode" placeholder="例如：4710126532014" class="w-full text-sm border rounded-lg p-2 font-mono">
            <button type="button" onclick="quickFillBarcode(true)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg text-xs whitespace-nowrap">查詢庫</button>
          </div>
          <p id="barcodeStatusTip" class="text-[11px] text-emerald-600 mt-1 hidden"></p>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">食材品名 *</label>
          <input type="text" id="itemName" required placeholder="例如：義美全脂鮮乳" class="w-full text-sm border rounded-lg p-2">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">存放區域 *</label>
            <select id="itemZone" class="w-full text-sm border rounded-lg p-2 bg-white">
              <option value="fridge">冷藏</option>
              <option value="freezer">冷凍</option>
              <option value="pantry">常溫/乾貨</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">圖示/種類</label>
            <select id="itemIcon" class="w-full text-sm border rounded-lg p-2 bg-white">
              <option value="fa-bottle-water">🥛 鮮奶/飲品</option>
              <option value="fa-egg">🥚 蛋品</option>
              <option value="fa-drumstick-bite">🥩 肉品/生鮮</option>
              <option value="fa-carrot">🥬 蔬菜/水果</option>
              <option value="fa-snowflake">🥟 冷凍食品</option>
              <option value="fa-box-open">🥫 調味/乾貨</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">現有數量 *</label>
            <input type="number" id="itemQty" required min="0" value="1" step="any" class="w-full text-sm border rounded-lg p-2">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">安全存量 (選填)</label>
            <input type="number" id="itemMinQty" min="0" placeholder="0" step="any" class="w-full text-sm border rounded-lg p-2">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">單位</label>
            <select id="itemUnit" class="w-full text-sm border rounded-lg p-2 bg-white">
              <option value="瓶">瓶</option>
              <option value="盒">盒</option>
              <option value="包">包</option>
              <option value="罐">罐</option>
              <option value="顆">顆</option>
              <option value="台斤">台斤</option>
              <option value="把">把</option>
              <option value="份">份</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">有效期限 (到期日) *</label>
          <input type="date" id="itemExpiry" required class="w-full text-sm border rounded-lg p-2">
        </div>
        <div class="pt-2 flex items-center justify-between gap-2">
          <button type="button" id="btnDeleteItem" onclick="deleteCurrentItem()" class="hidden py-2 px-3 border border-rose-200 text-rose-600 rounded-lg text-xs font-bold hover:bg-rose-50 flex items-center gap-1">
            <i class="fa-solid fa-trash-can"></i> 刪除
          </button>
          <div class="flex-1 flex justify-end gap-2">
            <button type="button" onclick="closeItemModal()" class="py-2 px-3 border rounded-lg text-xs text-slate-600 font-semibold hover:bg-slate-50">取消</button>
            <button type="submit" class="py-2 px-4 bg-emerald-600 text-white rounded-lg text-xs font-bold hover:bg-emerald-700 shadow">確認儲存</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- 彈窗：相機掃描條碼 -->
  <div id="scannerModal" class="fixed inset-0 bg-black/80 z-50 flex flex-col p-4 hidden backdrop-blur-md">
    <div class="flex justify-between items-center text-white pb-3">
      <h3 class="font-bold text-sm"><i class="fa-solid fa-camera mr-1 text-emerald-400"></i> 對準商品包裝條碼</h3>
      <button onclick="stopScannerModal()" class="text-white hover:text-slate-300 p-1"><i class="fa-solid fa-xmark text-xl"></i></button>
    </div>
    <div class="flex-1 flex flex-col items-center justify-center">
      <div id="qr-reader" class="w-full max-w-sm rounded-xl overflow-hidden shadow-lg border-2 border-emerald-400"></div>
      <div id="scanFeedback" class="mt-3 text-xs text-emerald-200">將條碼置於相機框線正中央</div>
    </div>
    <div class="py-3 flex flex-col space-y-2 max-w-sm mx-auto w-full">
      <input type="file" id="barcodeFileInput" accept="image/*" class="hidden" onchange="scanFromImage(this)">
      <button onclick="document.getElementById('barcodeFileInput').click()" class="w-full py-2 bg-white/20 hover:bg-white/30 text-white text-xs font-semibold rounded-lg">
        <i class="fa-regular fa-image mr-1"></i> 從相簿選取條碼照片
      </button>
      <button onclick="fallbackManualCode()" class="w-full py-2 bg-slate-700 hover:bg-slate-600 text-white text-xs rounded-lg">
        手動輸入或測試條碼
      </button>
    </div>
  </div>

  <!-- 彈窗：設定與自建條碼庫管理 -->
  <div id="settingsModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden backdrop-blur-sm">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-4 max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-center pb-2 border-b">
        <h3 class="font-bold text-slate-800 text-base">資料管理與條碼庫</h3>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <div class="space-y-2">
        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider">庫存清理</h4>
        <button onclick="clearAllInventory()" class="w-full py-2 bg-rose-50 border border-rose-200 text-rose-600 hover:bg-rose-100 rounded-lg text-xs font-bold flex items-center justify-center gap-1.5 transition">
          <i class="fa-solid fa-trash-can"></i> 一鍵清空冰箱所有食材 (重新開始)
        </button>
      </div>

      <div class="space-y-3 pt-2 border-t">
        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider">家庭備份與共享</h4>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="exportData()" class="py-2 px-3 border border-slate-300 rounded-lg text-xs font-semibold text-slate-700 hover:bg-slate-50 flex items-center justify-center space-x-1">
            <i class="fa-solid fa-download"></i>
            <span>匯出 JSON</span>
          </button>
          <label class="py-2 px-3 border border-slate-300 rounded-lg text-xs font-semibold text-slate-700 hover:bg-slate-50 flex items-center justify-center space-x-1 cursor-pointer">
            <i class="fa-solid fa-upload"></i>
            <span>匯入 JSON</span>
            <input type="file" accept=".json" onchange="importData(this)" class="hidden">
          </label>
        </div>
      </div>

      <div class="space-y-2 pt-2 border-t">
        <div class="flex justify-between items-center">
          <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider">台灣商品條碼庫 (<span id="barcodeCount">0</span>)</h4>
          <button onclick="resetToExpandedBarcodes()" class="text-[11px] text-emerald-600 hover:underline">載入更多預設條碼</button>
        </div>
        <div id="barcodeListContainer" class="max-h-48 overflow-y-auto space-y-1.5 custom-scroll text-xs"></div>
      </div>
      <div class="pt-2">
        <button onclick="closeSettingsModal()" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-lg">關閉</button>
      </div>
    </div>
  </div>

    function getFutureDateStr(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      return d.toISOString().split('T')[0];

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch(e) {}
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'zh-TW';
        utter.rate = 1.05;
        window.speechSynthesis.speak(utter);
      }
    }

    async function quickFillBarcode(showAlert = false) {
      const code = document.getElementById('itemBarcode').value.trim();

      statusTip.classList.add('hidden');

      if (!code) {

      if (barcodeDb[code]) {
        const data = barcodeDb[code];

        document.getElementById('itemZone').value = data.zone || 'fridge';
        document.getElementById('itemUnit').value = data.unit || '瓶';

      statusTip.className = "text-[11px] text-slate-500 mt-1 block";

    function normalizeChineseNumbers(str) {
      let result = str;
      result = result.replace(/剩一半|剩下一半|只有一半/g, '剩0.5');
      result = result.replace(/半(?:瓶|罐|盒|包|顆|袋|碗|份)/g, '0.5');

      const cnDigitMap = {
        '零': '0', '一': '1', '二': '2', '兩': '2', '三': '3',
        '四': '4', '五': '5', '六': '6', '七': '7', '八': '8', '九': '9'
      };

      result = result.replace(/十([一二兩三四五六七八九])/g, (_, d) => '1' + cnDigitMap[d]);
      result = result.replace(/([一二兩三四五六七八九])十/g, (_, d) => cnDigitMap[d] + '0');
      result = result.replace(/十/g, '10');
      result = result.replace(/[零一二兩三四五六七八九]/g, (m) => cnDigitMap[m]);

      return result;
    }

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('您的瀏覽器不支援語音辨識，建議使用手機版 Chrome 或 Edge 開啟。');
        return false;
      }
      recognition = new SpeechRecognition();
      recognition.lang = 'zh-TW';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('micBtn').classList.add('mic-recording');
        document.getElementById('voiceTranscriptTip').innerHTML = '🎙️ 正在聆聽...請說例如：<br>「林鳳營牛奶剩兩瓶」';
        document.getElementById('voiceTranscriptTip').classList.remove('hidden');
      };

      recognition.onresult = (event) => {
        const rawTranscript = event.results[0][0].transcript;
        parseVoiceCommand(rawTranscript);
      };

      recognition.onerror = () => {
        document.getElementById('voiceTranscriptTip').textContent = '⚠️ 語音未識別，請再試一次';
        setTimeout(() => document.getElementById('voiceTranscriptTip').classList.add('hidden'), 2500);
      };

      recognition.onend = () => {
        isListening = false;
        document.getElementById('micBtn').classList.remove('mic-recording');
        setTimeout(() => document.getElementById('voiceTranscriptTip').classList.add('hidden'), 4500);
      };

      return true;
    }

    function toggleVoiceRecognition() {
      if (!recognition) {
        if (!initSpeechRecognition()) return;
      }
      if (isListening) {
        recognition.stop();
      } else {
        try {
          recognition.start();
        } catch(e) {
          recognition.stop();
        }
      }
    }

    function findBestMatchingItem(spokenText) {
      let itemPart = spokenText.replace(/(?:剩|還有|剩下|變成|改為|只有|有|吃|喝|用|拿|完|沒有|沒|了|\d+(?:\.\d+)?|瓶|罐|盒|包|顆|袋|碗|份|台斤|把)/g, '').trim();
      if (!itemPart) itemPart = spokenText;

      let expandedQuery = itemPart;
      if (expandedQuery.includes('牛奶') || expandedQuery.includes('鮮奶')) expandedQuery += ' 鮮乳';
      if (expandedQuery.includes('鮮乳')) expandedQuery += ' 牛奶';
      if (expandedQuery.includes('豆漿')) expandedQuery += ' 豆奶';
      if (expandedQuery.includes('豆奶')) expandedQuery += ' 豆漿';

      let bestItem = null;
      let highestScore = 0;

      for (let item of inventory) {
        let score = 0;
        const targetName = item.name;

        if (targetName.includes(itemPart) && itemPart.length >= 2) {
          score += itemPart.length * 20;
        }

        const cleanQuery = expandedQuery.replace(/\s+/g, '');
        for (let i = 0; i < cleanQuery.length - 1; i++) {
          const bigram = cleanQuery.slice(i, i + 2);
          if (targetName.includes(bigram)) {
            score += 15;
          }
        }

        for (let char of itemPart) {
          if (char.trim() && targetName.includes(char)) {
            score += 2;
          }
        }

        if (score > highestScore) {
          highestScore = score;
          bestItem = item;
        }
      }

      return highestScore >= 15 ? bestItem : null;
    }

    function parseVoiceCommand(rawText) {
      const text = normalizeChineseNumbers(rawText);
      const matchedItem = findBestMatchingItem(text);

      if (!matchedItem) {
        const tip = `聽到：「${rawText}」<br>❌ 冰箱清單中找不到對應食材`;
        document.getElementById('voiceTranscriptTip').innerHTML = tip;
        speakText(`聽到了${rawText}，但在冰箱找不到對應食材。`);
        return;
      }

      let newQty = null;

      if (/(?:吃完|喝完|用完|沒有了|沒了|歸零)/.test(text)) {
        newQty = 0;
      } else if (/(?:剩|還有|剩下|變成|改為|只有|有)\s*(\d+(?:\.\d+)?)/.test(text)) {
        const matchSet = text.match(/(?:剩|還有|剩下|變成|改為|只有|有)\s*(\d+(?:\.\d+)?)/);
        newQty = parseFloat(matchSet[1]);
      } else if (/(?:吃|喝|用|拿)了?\s*(\d+(?:\.\d+)?)/.test(text)) {
        const matchMinus = text.match(/(?:吃|喝|用|拿)了?\s*(\d+(?:\.\d+)?)/);
        const minusVal = parseFloat(matchMinus[1]);
        newQty = Math.max(0, Number((matchedItem.qty - minusVal).toFixed(1)));
      } else if (/(\d+(?:\.\d+)?)\s*(?:瓶|罐|盒|包|顆|袋|碗|份|台斤|把)/.test(text)) {
        const matchUnitNum = text.match(/(\d+(?:\.\d+)?)\s*(?:瓶|罐|盒|包|顆|袋|碗|份|台斤|把)/);
        newQty = parseFloat(matchUnitNum[1]);
      }

      if (newQty === null || isNaN(newQty)) {
        const tip = `聽到：「${rawText}」<br>⚠️ 無法判斷數量，請說「剩幾瓶」`;
        document.getElementById('voiceTranscriptTip').innerHTML = tip;
        speakText('無法判斷數量，請再說一次剩幾瓶。');
        return;
      }

      matchedItem.qty = newQty;
      saveAll();

      const successMsg = `已將 ${matchedItem.name} 更新為 ${newQty} ${matchedItem.unit}`;
      document.getElementById('voiceTranscriptTip').innerHTML = `聽到：「${rawText}」<br>✅ ${successMsg}`;
      speakText(successMsg);

      const minVal = matchedItem.minQty || 0;
      if (newQty <= minVal && !shoppingList.some(s => s.name === matchedItem.name && !s.checked)) {
        setTimeout(() => {
          if (confirm(`「${matchedItem.name}」目前已剩 ${newQty} ${matchedItem.unit}，要加入採買清單嗎？`)) {
            shoppingList.push({ id: 'shop-' + Date.now(), name: matchedItem.name, unit: matchedItem.unit, qty: 1, checked: false });
            saveAll();
          }
        }, 700);
      }
    }

    function render() {
      renderInventory();
      renderSummary();
      renderShoppingList();
      updateBadges();

    function renderInventory() {
      const listEl = document.getElementById('foodList');
      listEl.innerHTML = '';

      let items = [...inventory];
      const today = new Date().setHours(0,0,0,0);
      items.sort((a,b) => new Date(a.expiry) - new Date(b.expiry));

      if (currentFilter !== 'all') {
        if (currentFilter === 'warning') {
          items = items.filter(item => {
            const exp = new Date(item.expiry).setHours(0,0,0,0);
            const daysLeft = Math.ceil((exp - today) / (1000*60*60*24));
            const minVal = item.minQty || 0;
            return daysLeft <= 3 || item.qty <= minVal;
          });
        } else {
          items = items.filter(item => item.zone === currentFilter);
        }
      }

      if (items.length === 0) {
        listEl.innerHTML = `
          <div class="text-center py-12 bg-white rounded-2xl border border-dashed border-slate-300">
            <i class="fa-solid fa-basket-shopping text-3xl text-slate-300 mb-2"></i>
            <p class="text-xs text-slate-400">目前沒有食材，點右上角「＋新增」或掃碼建檔</p>
          </div>
        `;
        return;
      }

      items.forEach(item => {
        const exp = new Date(item.expiry).setHours(0,0,0,0);
        const daysLeft = Math.ceil((exp - today) / (1000*60*60*24));
        const minVal = item.minQty || 0;
        const isLowStock = item.qty <= minVal;

        let statusBadge = '';
        let cardBorder = 'border-slate-200';

        if (daysLeft < 0) {
          statusBadge = `<span class="bg-rose-100 text-rose-700 text-[10px] font-bold px-1.5 py-0.5 rounded">過期 ${Math.abs(daysLeft)} 天</span>`;
          cardBorder = 'border-rose-300 bg-rose-50/20';
        } else if (daysLeft <= 3) {
          statusBadge = `<span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-1.5 py-0.5 rounded">剩 ${daysLeft} 天</span>`;
          cardBorder = 'border-amber-300 bg-amber-50/10';
        } else {
          statusBadge = `<span class="bg-emerald-50 text-emerald-700 text-[10px] font-medium px-1.5 py-0.5 rounded">${daysLeft} 天後</span>`;
        }

        const div = document.createElement('div');
        div.className = `bg-white border ${cardBorder} p-3 rounded-xl shadow-sm flex items-center justify-between transition active:scale-[0.99]`;
        div.innerHTML = `
          <div class="flex items-center space-x-3 flex-1 min-w-0 mr-2">
            <div class="w-10 h-10 rounded-lg bg-slate-100 flex items-center justify-center text-slate-600 text-base shrink-0">
              <i class="fa-solid ${item.icon || 'fa-box'}"></i>
            </div>
            <div class="min-w-0 flex-1">
              <div class="flex items-center space-x-1.5">
                <h4 class="font-bold text-slate-800 text-sm truncate">${item.name}</h4>
                ${statusBadge}
              </div>
              <div class="flex items-center space-x-2 text-xs text-slate-500 mt-0.5">
                <span>到期: ${item.expiry}</span>
                ${isLowStock ? '<span class="text-rose-600 font-semibold flex items-center"><i class="fa-solid fa-triangle-exclamation mr-0.5"></i>缺</span>' : ''}
              </div>
            </div>
          </div>
          <div class="flex items-center space-x-2 shrink-0">
            <div class="flex items-center bg-slate-100 rounded-lg p-0.5">
              <button onclick="changeQty('${item.id}', -1)" class="w-6 h-6 flex items-center justify-center text-slate-600 hover:bg-white rounded font-bold transition">-</button>
              <span class="px-2 text-xs font-bold text-slate-800 min-w-[2.5rem] text-center">${item.qty} <span class="text-[10px] font-normal text-slate-500">${item.unit}</span></span>
              <button onclick="changeQty('${item.id}', 1)" class="w-6 h-6 flex items-center justify-center text-slate-600 hover:bg-white rounded font-bold transition">+</button>
            </div>
            <button onclick="openEditModal('${item.id}')" class="text-slate-400 hover:text-slate-600 p-1.5" title="編輯或刪除">
              <i class="fa-solid fa-pen text-xs"></i>
            </button>
          </div>
        `;
        listEl.appendChild(div);
      });
    }

    function renderSummary() {
      const today = new Date().setHours(0,0,0,0);
      let expiredCount = 0;
      let soonCount = 0;
      let lowCount = 0;

      inventory.forEach(i => {
        const exp = new Date(i.expiry).setHours(0,0,0,0);
        const days = Math.ceil((exp - today) / (1000*60*60*24));
        const minVal = i.minQty || 0;
        if (days < 0) expiredCount++;
        else if (days <= 3) soonCount++;
        if (i.qty <= minVal) lowCount++;
      });

      const summaryEl = document.getElementById('alertSummary');
      if (inventory.length === 0) {
        summaryEl.innerHTML = `<span class="text-slate-500 font-medium">冰箱目前沒有食材，快掃碼或新增吧！</span>`;
      } else if (expiredCount === 0 && soonCount === 0 && lowCount === 0) {
        summaryEl.innerHTML = `<span class="text-emerald-700 font-medium">冰箱庫存狀態良好，暫無即將過期或缺貨食材。</span>`;
      } else {
        summaryEl.innerHTML = `
          已過期 <b class="text-rose-600">${expiredCount}</b> 樣 ｜
          3天內到期 <b class="text-amber-600">${soonCount}</b> 樣 ｜
          庫存不足 <b class="text-slate-700">${lowCount}</b> 樣
        `;
      }
    }

    function copyLineReport() {
      const today = new Date().setHours(0,0,0,0);
      let msg = `【智慧冰箱早報 🧊】\n日期：${new Date().toLocaleDateString('zh-TW')}\n------------------\n`;
      let hasIssue = false;

      inventory.forEach(i => {
        const exp = new Date(i.expiry).setHours(0,0,0,0);
        const days = Math.ceil((exp - today) / (1000*60*60*24));
        const minVal = i.minQty || 0;
        if (days < 0) {
          msg += `🔴 [已過期] ${i.name} (過期${Math.abs(days)}天)\n`;
          hasIssue = true;
        } else if (days <= 3) {
          msg += `🟡 [即將到期] ${i.name} (剩餘 ${i.qty}${i.unit}，${days}天後到期)\n`;
          hasIssue = true;
        }
        if (i.qty <= minVal) {
          msg += `🛒 [低存量] ${i.name} (現存 ${i.qty}${i.unit})\n`;
          hasIssue = true;
        }
      });

      if (!hasIssue) msg += `所有食材皆在安全期內，存量充裕！\n`;
      msg += `------------------\n記得打開冰箱管家確認哦！`;

      navigator.clipboard.writeText(msg).then(() => {
        alert('已複製 LINE 早報文字！可直接貼上至家庭群組。');
      }).catch(() => {
        alert('複製失敗，請手動選取複製');
      });
    }

    function changeQty(id, delta) {
      const item = inventory.find(i => i.id === id);
      if (!item) return;
      item.qty = Math.max(0, Number((item.qty + delta).toFixed(1)));
      const minVal = item.minQty || 0;
      
      if (item.qty <= minVal && !shoppingList.some(s => s.name === item.name && !s.checked)) {
        if (confirm(`「${item.name}」已達補貨標準，要加入採買清單嗎？`)) {
          shoppingList.push({ id: 'shop-' + Date.now(), name: item.name, unit: item.unit, qty: 1, checked: false });
        }
      }
      saveAll();
    }

    function updateBadges() {
      const today = new Date().setHours(0,0,0,0);
      document.getElementById('count-all').textContent = inventory.length;
      document.getElementById('count-fridge').textContent = inventory.filter(i => i.zone === 'fridge').length;
      document.getElementById('count-freezer').textContent = inventory.filter(i => i.zone === 'freezer').length;
      document.getElementById('count-pantry').textContent = inventory.filter(i => i.zone === 'pantry').length;
      
      const warnCount = inventory.filter(i => {
        const days = Math.ceil((new Date(i.expiry).setHours(0,0,0,0) - today) / (1000*60*60*24));
        const minVal = i.minQty || 0;
        return days <= 3 || i.qty <= minVal;
      }).length;
      document.getElementById('count-warning').textContent = warnCount;

      const unbought = shoppingList.filter(s => !s.checked).length;
      const sBadge = document.getElementById('shopBadge');
      if (unbought > 0) {
        sBadge.textContent = unbought;
        sBadge.classList.remove('hidden');
      } else {
        sBadge.classList.add('hidden');
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(b => {
        b.className = 'filter-tab px-3 py-1.5 rounded-full font-medium transition whitespace-nowrap bg-white text-slate-600 border border-slate-200';
      });
      const activeBtn = document.getElementById('tab-' + filter);
      if (filter === 'warning') {
        activeBtn.className = 'filter-tab px-3 py-1.5 rounded-full font-medium transition whitespace-nowrap bg-rose-600 text-white shadow-sm';
      } else {
        activeBtn.className = 'filter-tab px-3 py-1.5 rounded-full font-medium transition whitespace-nowrap bg-emerald-600 text-white shadow-sm';
      }
      renderInventory();
    }

    function switchView(view) {
      const invSec = document.getElementById('foodList');
      const shopSec = document.getElementById('shoppingSection');
      const navInv = document.getElementById('nav-inv');
      const navShop = document.getElementById('nav-shop');

      if (view === 'inventory') {
        invSec.classList.remove('hidden');
        shopSec.classList.add('hidden');
        navInv.className = "py-2.5 text-emerald-600 font-bold flex flex-col items-center";
        navShop.className = "py-2.5 text-slate-400 font-medium flex flex-col items-center relative";
      } else {
        invSec.classList.add('hidden');
        shopSec.classList.remove('hidden');
        navShop.className = "py-2.5 text-emerald-600 font-bold flex flex-col items-center relative";
        navInv.className = "py-2.5 text-slate-400 font-medium flex flex-col items-center";
      }
    }

    function renderShoppingList() {
      const container = document.getElementById('shoppingList');
      container.innerHTML = '';
      if (shoppingList.length === 0) {
        container.innerHTML = '<div class="text-xs text-slate-400 text-center py-6">目前沒有採買項目</div>';
        return;
      }
      shoppingList.forEach(item => {
        const div = document.createElement('div');
        div.className = "bg-white p-3 rounded-xl border border-slate-200 flex items-center justify-between shadow-sm";
        div.innerHTML = `
          <label class="flex items-center space-x-2 cursor-pointer flex-1">
            <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleShopping('${item.id}')" class="rounded text-emerald-600 h-4 w-4">
            <span class="text-sm ${item.checked ? 'line-through text-slate-400' : 'text-slate-800 font-medium'}">${item.name}</span>
          </label>
          <button onclick="removeShopping('${item.id}')" class="text-slate-300 hover:text-rose-500 p-1"><i class="fa-solid fa-trash-can text-xs"></i></button>
        `;
        container.appendChild(div);
      });
    }

    function toggleShopping(id) {
      const item = shoppingList.find(s => s.id === id);
      if (item) item.checked = !item.checked;
      saveAll();
    }

    function removeShopping(id) {
      shoppingList = shoppingList.filter(s => s.id !== id);
      saveAll();
    }

    function clearCompletedShopping() {
      shoppingList = shoppingList.filter(s => !s.checked);
      saveAll();
    }

    function openAddModal() {
      document.getElementById('modalTitle').textContent = '新增食材入庫';
      document.getElementById('editItemId').value = '';
      document.getElementById('itemBarcode').value = '';
      document.getElementById('itemName').value = '';
      document.getElementById('itemQty').value = '1';
      document.getElementById('itemMinQty').value = '';
      document.getElementById('itemExpiry').value = getFutureDateStr(7);
      document.getElementById('barcodeStatusTip').classList.add('hidden');
      document.getElementById('btnDeleteItem').classList.add('hidden');
      document.getElementById('itemModal').classList.remove('hidden');
    }

    function openEditModal(id) {
      const item = inventory.find(i => i.id === id);
      if (!item) return;
      document.getElementById('modalTitle').textContent = '編輯食材資訊';
      document.getElementById('editItemId').value = item.id;
      document.getElementById('itemBarcode').value = item.barcode || '';
      document.getElementById('itemName').value = item.name;
      document.getElementById('itemZone').value = item.zone;
      document.getElementById('itemIcon').value = item.icon || 'fa-box';
      document.getElementById('itemQty').value = item.qty;
      document.getElementById('itemMinQty').value = item.minQty ? item.minQty : '';
      document.getElementById('itemUnit').value = item.unit || '份';
      document.getElementById('itemExpiry').value = item.expiry;
      document.getElementById('barcodeStatusTip').classList.add('hidden');
      document.getElementById('btnDeleteItem').classList.remove('hidden');
      document.getElementById('itemModal').classList.remove('hidden');
    }

    function closeItemModal() {
      document.getElementById('itemModal').classList.add('hidden');
    }

    function deleteCurrentItem() {
      const id = document.getElementById('editItemId').value;
      const item = inventory.find(i => i.id === id);
      if (item && confirm(`確定要從冰箱刪除「${item.name}」嗎？`)) {
        inventory = inventory.filter(i => i.id !== id);
        closeItemModal();
        saveAll();
      }
    }

    function clearAllInventory() {
      if (confirm('確定要清空冰箱內的所有食材嗎？（自建與擴充的條碼資料庫皆會保留）')) {
        inventory = [];
        saveAll();
        closeSettingsModal();
      }
    }

    function handleSaveItem(e) {
      e.preventDefault();
      const id = document.getElementById('editItemId').value;
      const barcode = document.getElementById('itemBarcode').value.trim();
      const name = document.getElementById('itemName').value.trim();
      const zone = document.getElementById('itemZone').value;
      const icon = document.getElementById('itemIcon').value;
      const qty = parseFloat(document.getElementById('itemQty').value) || 0;
      const minQtyRaw = document.getElementById('itemMinQty').value.trim();
      const minQty = minQtyRaw === '' ? 0 : (parseFloat(minQtyRaw) || 0);
      const unit = document.getElementById('itemUnit').value;
      const expiry = document.getElementById('itemExpiry').value;

      if (barcode && name) {
        barcodeDb[barcode] = { name, zone, unit, minQty, icon, shelfDays: 14 };
      }

      if (id) {
        const item = inventory.find(i => i.id === id);
        if (item) Object.assign(item, { barcode, name, zone, icon, qty, minQty, unit, expiry });
      } else {
        inventory.push({ id: 'item-' + Date.now(), barcode, name, zone, icon, qty, minQty, unit, expiry });
      }

      closeItemModal();
      saveAll();
    }

    function startScannerModal() {
      document.getElementById('scannerModal').classList.remove('hidden');
      const readerEl = document.getElementById('qr-reader');
      readerEl.innerHTML = '';

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("qr-reader");
      }

      const config = { fps: 10, qrbox: { width: 250, height: 160 } };
      html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
      .catch(() => {
        document.getElementById('scanFeedback').textContent = '無法取得鏡頭權限，請改用手動或照片上傳。';
      });
    }

    function stopScannerModal() {
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => {
          document.getElementById('scannerModal').classList.add('hidden');
        }).catch(() => {
          document.getElementById('scannerModal').classList.add('hidden');
        });
      } else {
        document.getElementById('scannerModal').classList.add('hidden');
      }
    }

    async function onScanSuccess(decodedText) {
      playBeep();
      stopScannerModal();
      openAddModal();
      document.getElementById('itemBarcode').value = decodedText;
      await quickFillBarcode(false);
    }

    function scanFromImage(input) {
      if (!input.files || input.files.length === 0) return;
      const file = input.files[0];
      const html5QrCodeImg = new Html5Qrcode("qr-reader");
      html5QrCodeImg.scanFile(file, true)
        .then(async (decodedText) => {
          onScanSuccess(decodedText);
        })
        .catch(() => {
          alert("無法從照片辨識條碼，請換一張或手動輸入。");
        });
    }

    function fallbackManualCode() {
      stopScannerModal();
      const code = prompt("請輸入商品條碼（可測試瑞穗鮮乳：4710088430519）：", "4710088430519");
      if (code) {
        openAddModal();
        document.getElementById('itemBarcode').value = code;
        quickFillBarcode(false);
      }
    }

    function openSettingsModal() {
      document.getElementById('barcodeCount').textContent = Object.keys(barcodeDb).length;
      const listEl = document.getElementById('barcodeListContainer');
      listEl.innerHTML = '';
      Object.entries(barcodeDb).forEach(([code, item]) => {
        const row = document.createElement('div');
        row.className = "flex justify-between items-center bg-slate-50 p-2 rounded border";
        row.innerHTML = `
          <div class="truncate mr-2">
            <div class="font-bold text-slate-800">${item.name}</div>
            <div class="text-[10px] text-slate-400 font-mono">${code}</div>
          </div>
          <button onclick="deleteBarcode('${code}')" class="text-slate-300 hover:text-rose-500 p-1"><i class="fa-solid fa-trash-can"></i></button>
        `;
        listEl.appendChild(row);
      });
      document.getElementById('settingsModal').classList.remove('hidden');
    }

    function closeSettingsModal() {
      document.getElementById('settingsModal').classList.add('hidden');
    }

    function deleteBarcode(code) {
      if (confirm(`確定刪除條碼「${code}」的綁定資料嗎？`)) {
        delete barcodeDb[code];
        saveAll();
        openSettingsModal();
      }
    }

    function exportData() {
      const data = { inventory, barcodeDb, shoppingList, exportAt: new Date().toISOString() };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `fridge_backup_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (data.inventory && data.barcodeDb) {
            inventory = data.inventory;
            barcodeDb = data.barcodeDb;
            if (data.shoppingList) shoppingList = data.shoppingList;
            saveAll();
            alert('成功匯入家庭冰箱資料！');
            closeSettingsModal();
          } else {
            alert('檔案格式不相符！');
          }
        } catch(err) {
          alert('解析 JSON 檔案失敗');
        }
      };
      reader.readAsText(file);
    }

    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>
